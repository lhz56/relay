name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Core, privacy and voice checks (no microphone, keys or network needed)
        run: ./scripts/check.sh
      - name: Build and verify local app signature
        run: ./build.command
      - name: Audit source release inputs
        run: python3 scripts/package-source.py --check
